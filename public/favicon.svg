<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B58D23" />
    </linearGradient>
  </defs>
  
  <!-- Background Badge -->
  <rect width="100" height="100" rx="22" fill="#0B1325" />
  
  <!-- Outer Gold Border -->
  <rect x="3" y="3" width="94" height="94" rx="19" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" opacity="0.85" />
  
  <!-- Open Book & Literary Quill Symbolism -->
  <g transform="translate(18, 22) scale(0.64)">
    <!-- Left Book Page -->
    <path d="M50 82 C35 72 15 72 4 75 L4 18 C15 15 35 15 50 24 Z" fill="none" stroke="url(#goldGradient)" stroke-width="4.5" stroke-linejoin="round" />
    
    <!-- Right Book Page -->
    <path d="M50 82 C65 72 85 72 96 75 L96 18 C85 15 65 15 50 24 Z" fill="none" stroke="url(#goldGradient)" stroke-width="4.5" stroke-linejoin="round" />
    
    <!-- Spine Center -->
    <line x1="50" y1="24" x2="50" y2="82" stroke="url(#goldGradient)" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- Page Turn Lines -->
    <path d="M12 33 C23 30 37 30 46 36" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" opacity="0.6" stroke-linecap="round" />
    <path d="M12 47 C23 44 37 44 46 50" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" opacity="0.6" stroke-linecap="round" />
    <path d="M88 33 C77 30 63 30 54 36" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" opacity="0.6" stroke-linecap="round" />
    <path d="M88 47 C77 44 63 44 54 50" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" opacity="0.6" stroke-linecap="round" />
  </g>
  
  <!-- Literary Star / Diamond Accent -->
  <polygon points="50,14 53,20 59,20 54,24 56,30 50,26 44,30 46,24 41,20 47,20" fill="url(#goldGradient)" />
  
  <!-- CEC Initials -->
  <text x="50" y="85" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="url(#goldGradient)" letter-spacing="2.5">CEC</text>
</svg>
